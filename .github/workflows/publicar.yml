name: Atualizar dados e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"   # todos os dias ~05:30 em Lisboa

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- testes
  # Correm antes de publicar: se algum falhar, o app fica como estava.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair app
        run: |
          if [ -f stcp-app.zip ]; then unzip -q -n stcp-app.zip; fi
          test -d testes || { echo "Falta a pasta testes (envie o stcp-app.zip mais recente)"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Lógica pura: percursos, zonas, tempo real, meteorologia, formatação.
      # Os limiares de cobertura impedem que se acrescente código sem teste.
      - name: Testes de lógica, com cobertura
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-exclude='testes/**' \
            --test-coverage-lines=95 \
            --test-coverage-branches=85 \
            --test-coverage-functions=90 \
            "testes/*.test.js"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o browser de teste
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      # Ecrã: campos, resultados, detalhe, mapa, GPS, definições e respostas
      # estragadas das APIs. Não precisa de internet.
      - name: Testes de interface
        run: python3 testes/browser/testar_ui.py

  # ---------------------------------------------------------------- publicação
  publicar:
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Se o repositorio so tiver o stcp-app.zip, extrai-o (sem apagar ficheiros ja existentes)
      - name: Extrair app
        run: |
          if [ -f stcp-app.zip ]; then unzip -q -n stcp-app.zip; fi
          test -f scripts/build_data.py || { echo "Falta scripts/build_data.py (envie o stcp-app.zip)"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Descarregar horarios da STCP e gerar dados
        env:
          STCP_PROXY: ${{ vars.STCP_PROXY }}
        run: |
          if ! python scripts/build_data.py; then
            echo "::warning::Falhou a atualizacao dos horarios; a republicar os dados da ultima versao."
            mkdir -p site/data
            for f in net.json shapes.json meta.json; do
              curl -fsSL "${{ steps.pages.outputs.base_url }}/data/$f" -o "site/data/$f" || {
                echo "::error::Sem horarios novos nem publicacao anterior. Veja o erro acima."; exit 1; }
            done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
